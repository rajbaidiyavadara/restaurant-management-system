<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Magic FastFood</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="download.jpeg" type="image/x-icon">

  <style>
    :root {
      --primary: #ff6b35;
      --primary-dark: #e85d2b;
      --primary-light: rgba(255, 107, 53, 0.12);
      --secondary: #1a1a2e;
      --text: #2d2d2d;
      --text-muted: #888;
      --glass: rgba(255, 255, 255, 0.97);
      --border: #eaeaea;
      --success: #22c55e;
      --error: #ef4444;
      --shadow: 0 20px 60px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, rgba(0,0,0,0.65) 0%, rgba(30,10,0,0.7) 100%),
        url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      overflow: hidden;
      padding: 20px;
    }

    /* Floating blobs for ambience */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: var(--primary);
      top: -100px; right: -100px;
    }
    body::after {
      width: 300px; height: 300px;
      background: #ff9a5c;
      bottom: -80px; left: -60px;
    }

    .wrapper {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--glass);
      border-radius: 28px;
      padding: 44px 36px 40px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Brand */
    .brand-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--primary), #ff9a5c);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(255,107,53,0.35);
    }
    .brand-icon i { color: #fff; font-size: 1.4rem; }
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.45rem;
      color: var(--secondary);
      letter-spacing: -0.5px;
    }
    .brand-name span { color: var(--primary); }

    /* Headings */
    h2 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--secondary);
      text-align: center;
      margin-bottom: 4px;
    }
    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* Form Controls */
    .input-group-custom {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group-custom .icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
      transition: color 0.2s;
      z-index: 2;
    }
    .input-group-custom textarea ~ .icon {
      top: 18px;
      transform: none;
    }
    .input-group-custom input,
    .input-group-custom textarea {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 2px solid var(--border);
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
      appearance: none;
    }
    .input-group-custom textarea {
      height: 90px;
      resize: none;
      padding-top: 14px;
    }
    .input-group-custom input:focus,
    .input-group-custom textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-light);
    }
    .input-group-custom input:focus ~ .icon,
    .input-group-custom textarea:focus ~ .icon {
      color: var(--primary);
    }
    .input-group-custom input::placeholder,
    .input-group-custom textarea::placeholder {
      color: #bbb;
    }

    /* Password toggle */
    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      z-index: 2;
      padding: 4px;
      transition: color 0.2s;
    }
    .toggle-pass:hover { color: var(--primary); }

    /* Alert box */
    .alert-box {
      display: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 16px;
      align-items: center;
      gap: 10px;
    }
    .alert-box.show { display: flex; }
    .alert-box.success { background: rgba(34,197,94,0.1); color: #16a34a; border: 1px solid rgba(34,197,94,0.25); }
    .alert-box.error   { background: rgba(239,68,68,0.1);  color: #dc2626; border: 1px solid rgba(239,68,68,0.25); }

    /* Submit button */
    .btn-main {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary), #ff8c5a);
      color: white;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      margin-top: 6px;
      box-shadow: 0 8px 24px rgba(255,107,53,0.35);
      position: relative;
      overflow: hidden;
    }
    .btn-main:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255,107,53,0.45);
    }
    .btn-main:active:not(:disabled) { transform: translateY(0); }
    .btn-main:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 18px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Switch link */
    .switch-link {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .switch-link span {
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .switch-link span:hover { opacity: 0.8; text-decoration: underline; }

    /* Show/hide */
    .hidden { display: none !important; }

    /* Fade transition */
    .form-section { animation: fadeForm 0.35s ease both; }
    @keyframes fadeForm {
      from { opacity: 0; transform: translateX(10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="login-card">

      <div class="brand-logo">
        <div class="brand-icon"><i class="fas fa-utensils"></i></div>
        <div class="brand-name">Magic <span>FastFood</span></div>
      </div>

      <!-- ── LOGIN FORM ── -->
      <div id="login-box" class="form-section">
        <h2>Welcome Back 👋</h2>
        <p class="subtitle">Login to order delicious food</p>

        <div id="login-alert" class="alert-box"></div>

        <div class="input-group-custom">
          <input type="tel" id="login-phone" placeholder="Phone Number" maxlength="15" required />
          <i class="fas fa-phone icon"></i>
        </div>

        <div class="input-group-custom">
          <input type="password" id="login-pass" placeholder="Password" required />
          <i class="fas fa-lock icon"></i>
          <i class="fas fa-eye toggle-pass" onclick="togglePassword('login-pass', this)"></i>
        </div>

        <button class="btn-main" id="loginBtn" onclick="handleLogin()">
          LOGIN &nbsp;<i class="fas fa-arrow-right"></i>
        </button>

        <div class="divider">or</div>
        <div class="switch-link">Don't have an account? <span onclick="switchForm('signup')">Register Now</span></div>
      </div>

      <!-- ── SIGNUP FORM ── -->
      <div id="signup-box" class="form-section hidden">
        <h2>Create Account 🎉</h2>
        <p class="subtitle">Join us and get food delivered fast!</p>

        <div id="signup-alert" class="alert-box"></div>

        <div class="input-group-custom">
          <input type="text" id="reg-name" placeholder="Full Name" required />
          <i class="fas fa-user icon"></i>
        </div>

        <div class="input-group-custom">
          <input type="tel" id="reg-phone" placeholder="Phone Number" maxlength="15" required />
          <i class="fas fa-phone icon"></i>
        </div>

        <div class="input-group-custom">
          <input type="password" id="reg-pass" placeholder="Create Password" required />
          <i class="fas fa-lock icon"></i>
          <i class="fas fa-eye toggle-pass" onclick="togglePassword('reg-pass', this)"></i>
        </div>

        <div class="input-group-custom">
          <textarea id="reg-address" placeholder="Delivery Address"></textarea>
          <i class="fas fa-map-marker-alt icon"></i>
        </div>

        <button class="btn-main" id="regBtn" onclick="handleRegister()">
          CREATE ACCOUNT &nbsp;<i class="fas fa-check-circle"></i>
        </button>

        <div class="divider">or</div>
        <div class="switch-link">Already have an account? <span onclick="switchForm('login')">Login Here</span></div>
      </div>

    </div>
  </div>

  <script>
    const API = 'http://localhost:3000'; // Change this if your server runs on a different port

    // ── Toggle password visibility ──
    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.toggle('fa-eye', !isHidden);
      icon.classList.toggle('fa-eye-slash', isHidden);
    }

    // ── Switch between login/signup ──
    function switchForm(to) {
      document.getElementById('login-box').classList.toggle('hidden', to !== 'login');
      document.getElementById('signup-box').classList.toggle('hidden', to !== 'signup');
      showAlert('login-alert', '', '');
      showAlert('signup-alert', '', '');
    }

    // ── Show alert messages ──
    function showAlert(id, type, message) {
      const el = document.getElementById(id);
      el.className = 'alert-box';
      if (!message) { el.classList.remove('show'); return; }
      el.classList.add('show', type);
      el.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${message}`;
    }

    // ── Set button loading state ──
    function setLoading(btnId, loading, defaultHTML) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? `<span class="spinner"></span> Please wait...`
        : defaultHTML;
    }

    // ── Handle Login ──
    async function handleLogin() {
      const phone    = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-pass').value;

      if (!phone || !password) {
        return showAlert('login-alert', 'error', 'Please enter your phone number and password.');
      }

      setLoading('loginBtn', true);

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const result = await res.json();

        if (result.success) {
          showAlert('login-alert', 'success', 'Login successful! Redirecting...');
          localStorage.setItem('user', JSON.stringify(result.user));
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          showAlert('login-alert', 'error', result.message || 'Invalid phone number or password.');
          setLoading('loginBtn', false, 'LOGIN &nbsp;<i class="fas fa-arrow-right"></i>');
        }

      } catch (err) {
        console.error('Login error:', err);
        showAlert('login-alert', 'error', '⚠️ Cannot connect to server. Make sure Node.js is running on port 3000.');
        setLoading('loginBtn', false, 'LOGIN &nbsp;<i class="fas fa-arrow-right"></i>');
      }
    }

    // ── Handle Register ──
    async function handleRegister() {
      const name     = document.getElementById('reg-name').value.trim();
      const phone    = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-pass').value;
      const address  = document.getElementById('reg-address').value.trim();

      if (!name || !phone || !password) {
        return showAlert('signup-alert', 'error', 'Name, phone, and password are required.');
      }
      if (phone.length < 10) {
        return showAlert('signup-alert', 'error', 'Please enter a valid phone number.');
      }
      if (password.length < 6) {
        return showAlert('signup-alert', 'error', 'Password must be at least 6 characters.');
      }

      setLoading('regBtn', true);

      try {
        const res = await fetch(`${API}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password, address })
        });

        const result = await res.json();

        if (result.success) {
          showAlert('signup-alert', 'success', 'Account created! Switching to login...');
          // Clear fields
          ['reg-name','reg-phone','reg-pass','reg-address'].forEach(id => {
            document.getElementById(id).value = '';
          });
          setTimeout(() => switchForm('login'), 1500);
        } else {
          showAlert('signup-alert', 'error', result.message || 'Registration failed. Please try again.');
        }

      } catch (err) {
        console.error('Register error:', err);
        showAlert('signup-alert', 'error', '⚠️ Cannot connect to server. Make sure Node.js is running on port 3000.');
      } finally {
        setLoading('regBtn', false, 'CREATE ACCOUNT &nbsp;<i class="fas fa-check-circle"></i>');
      }
    }

    // ── Allow Enter key to submit ──
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (!document.getElementById('login-box').classList.contains('hidden')) handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
