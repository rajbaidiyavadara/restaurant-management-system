<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Item | Magic Admin</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="icon" href="download.jpeg" type="image/x-icon">

  <style>
    body { background-color: #f0f2f5; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
    
    /* Fixed Sidebar (Same as Index) */
    .sidebar { 
        height: 100vh; 
        width: 260px; 
        position: fixed; 
        top: 0; 
        left: 0; 
        background: #212529; 
        color: white; 
        padding-top: 25px; 
        z-index: 1000; 
        overflow-y: auto; 
        transition: 0.3s; 
    }
    .sidebar h3 { font-size: 1.5rem; margin-bottom: 30px; font-weight: 800; color: #ff6b35; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .nav-link { color: rgba(255,255,255,0.7); padding: 16px 25px; cursor: pointer; transition: 0.3s; font-size: 1rem; border-left: 4px solid transparent; }
    .nav-link:hover { background: #2c3e50; color: white; padding-left: 30px; }
    .nav-link.active { background: #2c3e50; color: #ff6b35; border-left: 4px solid #ff6b35; font-weight: 600; }
    .nav-link i { width: 30px; }

    /* Content Area */
    .content { margin-left: 260px; padding: 40px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }

    /* Form Container */
    .form-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 900px; }
    .form-header { margin-bottom: 30px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
    .form-control:focus, .form-select:focus { border-color: #ff6b35; box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1); }
    
    /* Live Preview Card */
    .preview-box { background: #f8f9fa; padding: 20px; border-radius: 15px; text-align: center; border: 2px dashed #ddd; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .card-preview { width: 280px; border: none; border-radius: 16px; background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; transition: transform 0.3s; margin: 0 auto; }
    .preview-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
    .preview-body { padding: 20px; text-align: center; }
    .preview-title { font-weight: 700; color: #2c3e50; font-size: 1.2rem; margin-bottom: 5px; }
    .preview-desc { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 15px; height: 40px; overflow: hidden; }
    .preview-price { font-size: 1.4rem; font-weight: 800; color: #e63946; display: block; margin-bottom: 0; }
    
    /* Submit Button */
    .btn-submit { background: linear-gradient(135deg, #ff6b35, #ff9f43); border: none; padding: 15px; font-size: 1.1rem; font-weight: 700; color: white; border-radius: 10px; width: 100%; transition: 0.3s; margin-top: 20px; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3); }

    @media (max-width: 768px) {
        .sidebar { width: 70px; padding-top: 80px; }
        .sidebar h3, .nav-link span { display: none; }
        .content { margin-left: 70px; padding: 20px; }
        .nav-link i { margin: 0; font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h3>Magic Admin</h3>
    <div class="nav flex-column">
      <a href="admin.html" class="nav-link"><i class="fas fa-chart-line"></i> <span>Dashboard</span></a>
      <a href="view_category.html" class="nav-link"><i class="fas fa-list"></i> <span>Manage Menu</span></a>
      <a href="add_category.html" class="nav-link active"><i class="fas fa-plus-circle"></i> <span>Add Item</span></a>
      <a href="index.html" class="nav-link"><i class="fas fa-home"></i> <span>Back to Website</span></a>
      <a href="#" onclick="logout()" class="nav-link text-danger mt-5"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>
    </div>
  </div>

  <div class="content">
    <div class="form-container">
        <div class="form-header d-flex justify-content-between align-items-center">
            <h3 class="fw-bold mb-0 text-dark"><i class="fas fa-utensils text-warning me-2"></i>Add Menu Item</h3>
            <span class="badge bg-success">Real-time Preview</span>
        </div>

        <div class="row">
            <div class="col-lg-7">
                <form id="addItemForm" onsubmit="submitForm(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Item Name</label>
                            <input type="text" class="form-control" id="inpName" placeholder="e.g. Spicy Paneer Pizza" oninput="updatePreview()" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="inpCategory" onchange="updatePreview()">
                                <option value="Pizza">Pizza</option>
                                <option value="Burger">Burger</option>
                                <option value="Fries">Fries</option>
                                <option value="Milkshake">Milkshake</option>
                                <option value="Sandwich">Sandwich</option>
                                <option value="Salad">Salad</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="inpDesc" rows="2" placeholder="Describe ingredients..." oninput="updatePreview()"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Price (₹)</label>
                            <input type="number" class="form-control" id="inpPrice" placeholder="299" oninput="updatePreview()" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Image URL</label>
                            <input type="text" class="form-control" id="inpImage" placeholder="https://..." oninput="updatePreview()">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-check-circle me-2"></i> Publish to Website
                    </button>
                </form>
            </div>

            <div class="col-lg-5 mt-4 mt-lg-0">
                <h6 class="text-muted fw-bold mb-3 text-center">WEBSITE CARD PREVIEW</h6>
                <div class="preview-box">
                    <div class="card-preview">
                        <img src="https://via.placeholder.com/280x200?text=Image" id="prevImg" class="preview-img">
                        <div class="preview-body">
                            <h5 class="preview-title" id="prevName">Item Name</h5>
                            <p class="preview-desc small text-muted" id="prevDesc">Description goes here...</p>
                            <span class="preview-price" id="prevPrice">₹0</span>
                        </div>
                    </div>
                    <p class="mt-3 text-muted small"><i class="fas fa-info-circle me-1"></i> This item will appear on the <span id="targetPageName" class="fw-bold">Pizza</span> page.</p>
                </div>
            </div>
        </div>
    </div>
  </div>

  <script>
    // Update Preview Function
    function updatePreview() {
        const name = document.getElementById('inpName').value || "Item Name";
        const desc = document.getElementById('inpDesc').value || "Description goes here...";
        const price = document.getElementById('inpPrice').value || "0";
        const image = document.getElementById('inpImage').value;
        const category = document.getElementById('inpCategory').value;

        document.getElementById('prevName').innerText = name;
        document.getElementById('prevDesc').innerText = desc;
        document.getElementById('prevPrice').innerText = "₹" + price;
        document.getElementById('targetPageName').innerText = category;
        
        const imgElement = document.getElementById('prevImg');
        if (image) {
            imgElement.src = image;
            imgElement.onerror = function() { this.src = 'https://via.placeholder.com/280x200?text=Invalid+Link'; };
        } else {
            imgElement.src = 'https://via.placeholder.com/280x200?text=Image';
        }
    }

    // Submit to Backend
    async function submitForm(e) {
        e.preventDefault();
        
        const itemData = {
            name: document.getElementById('inpName').value,
            desc: document.getElementById('inpDesc').value,
            category: document.getElementById('inpCategory').value,
            price: document.getElementById('inpPrice').value,
            image: document.getElementById('inpImage').value || "./pizza1.jpg"
        };

        try {
            const response = await fetch('http://localhost:3000/menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            });

            const result = await response.json();

            if (result.success) {
                alert("Success! " + itemData.name + " added to " + itemData.category + " menu.");
                document.getElementById('addItemForm').reset();
                updatePreview(); 
            } else {
                alert("Error: " + result.message);
            }
        } catch (error) {
            console.error(error);
            alert("Server Connection Failed!");
        }
    }

    function logout() {
        if(confirm("Logout from Admin Panel?")) window.location.href = "index.html";
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
